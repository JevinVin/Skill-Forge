services:
  postgres:
    image: postgres:15-alpine
    container_name: learning_platform_db
    environment:
      POSTGRES_DB: ${DB_NAME:-learningplatform}
      POSTGRES_USER: ${DB_USERNAME:-lpuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lppassword}
    ports:
      - "5432:5432"
    volumes:
      # Named volume so data survives container restarts
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-lpuser} -d ${DB_NAME:-learningplatform}" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
